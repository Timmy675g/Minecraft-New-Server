#CloudChat Configuration
#
#API Secret Notes:
#
#The api_secret is your API password/token used for authentication.
#
#You can name it anything you want.
#You do NOT need to generate it from Cloudflare.
#
#This is NOT your Worker URL.
#
#Example:
#worker_url=https://your-worker.workers.dev
#api_secret=your_secret_token
#
#
#Recommended AI Models:
#
#@cf/meta/llama-3.1-8b-instruct
#- Best balanced model for Minecraft servers
#
#@cf/meta/llama-3.2-3b-instruct
#- Faster and lightweight
#
#@cf/mistral/mistral-7b-instruct-v0.1
#- Good alternative conversational model
#
#Browse more Cloudflare Workers AI models:
#https://developers.cloudflare.com/workers-ai/models/
#
#Thu May 14 06:10:54 UTC 2026
ai_name=CloudChat
allow_dimension=true
allow_online_player_count=true
allow_player_coordinates=false
allow_world_time=true
api_secret=Worker311@
command_name=KendyAI
cooldown_seconds=6
max_message_length=300
model=@cf/meta/llama-3.1-8b-instruct
safe_mode=true
system_prompt=You are KendyAI, a helpful Minecraft server assistant for SurvivalKendy. Answer clearly and naturally. Do not invent server information, player data, coordinates, inventories, commands, or structures unless they are provided to you. If you do not know something, say you do not have access to that information.
worker_url=https://kendy-ai-worker.timmylionel.workers.dev

