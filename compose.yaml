services:
  mc:
    image: itzg/minecraft-server:latest
    container_name: minecraft-docker-new
    tty: true
    stdin_open: true
    ports:
      - "25565:25565"
      - "19132:19132/udp"
    environment:
      EULA: "TRUE"
      TYPE: "FABRIC"
      VERSION: "LATEST"
      JVM_OPTS: "-Xms3G -Xmx6G -XX:+UseG1GC -XX:+ParallelRefProcEnabled -XX:MaxGCPauseMillis=200 -XX:+UnlockExperimentalVMOptions -XX:+DisableExplicitGC -XX:+PerfDisableSharedMem -XX:G1NewSizePercent=20 -XX:G1MaxNewSizePercent=40 -XX:G1HeapRegionSize=8M -XX:G1ReservePercent=15 -XX:InitiatingHeapOccupancyPercent=20"
    volumes:
      - /mnt/volume_sgp1_1778294886794/minecraft/world:/data/world
      - /mnt/volume_sgp1_1778294886794/minecraft/mods:/data/mods
      - /mnt/volume_sgp1_1778294886794/minecraft/config:/data/config
      - /mnt/volume_sgp1_1778294886794/minecraft/server.properties:/data/server.properties
    restart: unless-stopped
